                                 data-images='${JSON.stringify(images)}' data-index="0"
                                 onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found'">
                            <button class="carousel-arrow prev" onclick="carouselPrev('${carouselId}', event)">&#8249;</button>
                            <button class="carousel-arrow next" onclick="carouselNext('${carouselId}', event)">&#8250;</button>
                        </div>
                        <div class="carousel-dots">
                            ${images.map((_, i) => `<span class="carousel-dot${i === 0 ? ' active' : ''}" id="${carouselId}-dot-${i}"></span>`).join('')}
                        </div>
                        <div class="artwork-info">
                            <div class="artwork-info-name">${artwork.name}</div>
                            <div class="artwork-info-meta">${artwork.year} · ${artwork.medium}${artwork.size ? ' · ' + artwork.size : ''}</div>
                            <div class="artwork-info-price">${artwork.price}</div>
                        </div>
                    `;
                } else {
                    const imageSrc = (typeof imageSource === 'object' && imageSource.gallery)
                                     ? imageSource.gallery
                                     : (imageSource || 'https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found');
                    listItem.innerHTML = `
                        <div class="artwork-image-container">
                            <img src="${imageSrc}" alt="${artwork.name}" class="artwork-image" onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found'">
                        </div>
                        <div class="artwork-info">
                            <div class="artwork-info-name">${artwork.name}</div>
                            <div class="artwork-info-meta">${artwork.year} · ${artwork.medium}${artwork.size ? ' · ' + artwork.size : ''}</div>
                            <div class="artwork-info-price">${artwork.price}</div>
                        </div>
                    `;
                }
                
                listItem.addEventListener('click', () => showArtworkDetail(key));
                galleryList.appendChild(listItem);
            }
        }

        // Function to create masonry gallery items - ONLY shows secondary/detail images
        function createMasonryGalleryItems() {
            const masonryList = document.getElementById('masonry-gallery-view');
            masonryList.innerHTML = '';
            
            // Neue Bilder die oben erscheinen sollen (in der Reihenfolge)
            const additionalImages = [
                "https://i.imgur.com/NmNfEfD.jpeg",
                "https://i.imgur.com/NwrJQ0y.jpeg",
                "https://i.imgur.com/7YKcguq.jpeg",
                "https://i.imgur.com/JWLZ37i.jpeg",
                "https://i.imgur.com/SH1UQwW.jpeg",
                "https://i.imgur.com/DIgrfQM.jpeg",
                "https://i.imgur.com/iy0zPK1.jpeg",
                "https://i.imgur.com/60f8D5z.jpeg",
                "https://i.imgur.com/lJEOYqH.jpeg",
                "https://i.imgur.com/JtJzuww.jpeg",
                "https://i.imgur.com/l2o7p7I.jpeg",
                "https://i.imgur.com/1bstcAM.jpeg",
                "https://i.imgur.com/VmSa6Af.jpeg",
                "https://i.imgur.com/qPqwgif.jpeg",
                "https://i.imgur.com/7DtdlLq.jpeg",
                "https://i.imgur.com/Q0wFw4m.jpeg",
                "https://i.imgur.com/LfpIuA5.jpeg",
                "https://i.imgur.com/qMeCVSm.jpeg",
                "https://i.imgur.com/i6t77nE.jpeg"
            ];
            
            // Zuerst die neuen Bilder hinzufügen
            additionalImages.forEach((imageSrc, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'masonry-item';
                listItem.setAttribute('data-artwork-id', `additional-${index}`);
                
                listItem.innerHTML = `
                    <img src="${imageSrc}" alt="Gallery Image ${index + 1}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found'">
                `;
                
                // Klick öffnet nur Fullscreen-Ansicht
                listItem.addEventListener('click', () => openFullscreenView(imageSrc));
                masonryList.appendChild(listItem);
            });
            
            // Dann die bestehenden Kunstwerke hinzufügen
            for (const key in artworks) {
                // Skip "air-before-2016" artwork
                if (key === 'air-before-2016') {
                    continue;
                }
                
                // ONLY include artworks that have BOTH gallery and detail images (secondary images)
                const imageSource = imageSources[key];
                
                // Skip if this artwork doesn't have separate gallery and detail images
                if (typeof imageSource !== 'object' || !imageSource.detail) {
                    continue;
                }
                
                const artwork = artworks[key];
                const listItem = document.createElement('li');
                listItem.className = 'masonry-item';
                listItem.setAttribute('data-artwork-id', key);

                // Use the DETAIL image (secondary image) for the gallery view
                const imageSrc = imageSource.detail;

                listItem.innerHTML = `
                    <img src="${imageSrc}" alt="${artwork.name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found'">
                `;
                
                // Klick öffnet nur Fullscreen-Ansicht, keine Detailansicht
                listItem.addEventListener('click', () => openFullscreenView(imageSrc));
                masonryList.appendChild(listItem);
            }
        }

        // Function to show the artwork details
        function showArtworkDetail(id) {
            // Push a history state so the browser Back button returns to the gallery
            history.pushState({ view: 'detail', id }, '', `#artwork-${id}`);

            const mainGallery = document.getElementById('main-gallery');
            const masonryGallery = document.getElementById('masonry-gallery-view');
            const detailView = document.getElementById('artwork-detail');
            const container = document.querySelector('.gallery-container');
            const artwork = artworks[id];

            if (!artwork) {
                console.error('Artwork not found for ID:', id);
                return;
            }

            const imageSource = imageSources[id];
            const isCarousel = typeof imageSource === 'object' && Array.isArray(imageSource.gallery);

            let imageHTML;
            if (isCarousel) {
                const images = imageSource.gallery;
                const carouselId = `detail-carousel-${id}`;
                imageHTML = `
                    <div id="${carouselId}" style="position:relative; max-width:560px; margin:0 auto 0;">
                        <img src="${images[0]}" alt="${artwork.name}" class="detail-image ${id === 'itaped' ? 'large-detail itaped-adjust' : ''}"
                             data-images='${JSON.stringify(images)}' data-index="0"
                             id="${carouselId}-img"
                             onclick="openFullscreenView(this.src)"
                             onerror="this.onerror=null;this.src='https://placehold.co/800x600/A0A0A0/ffffff?text=Image+Not+Found'">
                        <button class="carousel-arrow prev" style="top:45%;" onclick="carouselPrev('${carouselId}', event)">&#8249;</button>
                        <button class="carousel-arrow next" style="top:45%;" onclick="carouselNext('${carouselId}', event)">&#8250;</button>
                    </div>
                    <div class="carousel-dots" style="margin-bottom:0.5rem;">
                        ${images.map((_, i) => `<span class="carousel-dot${i === 0 ? ' active' : ''}" id="${carouselId}-dot-${i}"></span>`).join('')}
                    </div>
                `;
            } else {
                const imageSrc = (typeof imageSource === 'object' && imageSource.detail)
                                 ? imageSource.detail
                                 : (imageSource || 'https://placehold.co/500x500/A0A0A0/ffffff?text=Image+Not+Found');
                imageHTML = `<img src="${imageSrc}" alt="${artwork.name}" class="detail-image ${id === 'itaped' ? 'large-detail itaped-adjust' : ''}" onclick="openFullscreenView('${imageSrc}')" onerror="this.onerror=null;this.src='https://placehold.co/800x600/A0A0A0/ffffff?text=Image+Not+Found'">`;
            }

            detailView.innerHTML = `
                ${imageHTML}
                <div class="detail-info">
                    <div>
                        <h2>${artwork.name}</h2>
                        <div style="margin-bottom: 1.5rem; font-weight: 300; font-style: italic; line-height: 1.5;">${artwork.description || ''}</div>
                        <strong>Year:</strong> <span>${artwork.year}</span><br>
                        <strong>Medium:</strong> <span>${artwork.medium}</span><br>
                        <strong>Size:</strong> <span>${artwork.size}</span>
                        <div class="price-line" style="margin-top: 0.5rem; font-weight: 600; color: var(--primary-color);">${artwork.price}</div>
                    </div>
                    <div></div>
                </div>
            `;

            if (isCarousel) {
                const carouselId = `detail-carousel-${id}`;
                const images = imageSource.gallery;
                const img = document.getElementById(`${carouselId}-img`);
                if (img) {
                    img.dataset.images = JSON.stringify(images);
                    img.dataset.index = '0';
                }
            }

            mainGallery.style.display = 'none';
            masonryGallery.style.display = 'none';
            detailView.style.display = 'block';
            container.classList.remove('full-width');
            window.scrollTo(0, 0);
        }

        // Function to show home (the gallery view on index.html)
        function showHome() {
            const mainGallery = document.getElementById('main-gallery');
            const masonryGallery = document.getElementById('masonry-gallery-view');
            const detailView = document.getElementById('artwork-detail');
            const contactView = document.getElementById('contact-view');
            const container = document.querySelector('.gallery-container');
            
            mainGallery.style.display = 'grid';
            masonryGallery.style.display = 'none';
            detailView.style.display = 'none';
            contactView.style.display = 'none';
            container.classList.remove('full-width');
            
            updateNavigation('home');
            window.scrollTo(0, 0);
        }

        // Function to show masonry gallery
        function showMasonryGallery() {
            const mainGallery = document.getElementById('main-gallery');
            const masonryGallery = document.getElementById('masonry-gallery-view');
            const detailView = document.getElementById('artwork-detail');
            const contactView = document.getElementById('contact-view');
            const container = document.querySelector('.gallery-container');
            
            mainGallery.style.display = 'none';
            masonryGallery.style.display = 'block';
            detailView.style.display = 'none';
            contactView.style.display = 'none';
            container.classList.add('full-width');
            
            // Create masonry items if not already created
            if (masonryGallery.children.length === 0) {
                createMasonryGalleryItems();
            }
            
            updateNavigation('gallery');
            window.scrollTo(0, 0);
        }

        // Function to go back to the gallery (used by logo and back navigation)
        function showGallery(fromButton) {
            showHome();
        }

        // Function to show contact page (placeholder for now)
        function showContact() {
            const mainGallery = document.getElementById('main-gallery');
            const masonryGallery = document.getElementById('masonry-gallery-view');
            const detailView = document.getElementById('artwork-detail');
            const contactView = document.getElementById('contact-view');
            const container = document.querySelector('.gallery-container');
            
            mainGallery.style.display = 'none';
            masonryGallery.style.display = 'none';
            detailView.style.display = 'none';
            contactView.style.display = 'block';
            container.classList.remove('full-width');
            
            updateNavigation('contact');
            window.scrollTo(0, 0);
        }

        // Function to update navigation active state
        function updateNavigation(activePage) {
            // Remove active class from all nav links
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            
            // Add active class only to the clicked page
            if (activePage === 'home') {
                document.getElementById('nav-home').classList.add('active');
            } else if (activePage === 'gallery') {
                document.getElementById('nav-gallery').classList.add('active');
            } else if (activePage === 'contact') {
                document.getElementById('nav-contact').classList.add('active');
            }
        }

        // Function to open the fullscreen view
        function openFullscreenView(imageSrc) {
            const overlay = document.getElementById('fullscreen-overlay');
            const image = document.getElementById('fullscreen-image');
            image.src = imageSrc;
            overlay.style.display = 'flex';
        }

        // Function to close the fullscreen view
        function closeFullscreenView() {
            const overlay = document.getElementById('fullscreen-overlay');
            overlay.style.display = 'none';
        }

        // Handle browser navigation (Back/Forward)
        window.addEventListener('popstate', (event) => {
            const state = event.state;
            if (!state || state.view === 'gallery') {
                // Show gallery when no state or gallery state
                const mainGallery = document.getElementById('main-gallery');
                const masonryGallery = document.getElementById('masonry-gallery-view');
                const detailView = document.getElementById('artwork-detail');
                mainGallery.style.display = 'grid';
                masonryGallery.style.display = 'none';
                detailView.style.display = 'none';
                return;
            }

            if (state.view === 'detail' && state.id) {
                // Reopen the detail for the given artwork id
                showArtworkDetail(state.id);
            }
        });

        function carouselNav(carouselId, direction, event) {
            event.stopPropagation();
            const container = document.getElementById(carouselId);
            const img = container.querySelector('img');
            const images = JSON.parse(img.dataset.images);
            let index = parseInt(img.dataset.index);
            index = (index + direction + images.length) % images.length;
            img.src = images[index];
            img.dataset.index = index;
            for (let i = 0; i < images.length; i++) {
                const dot = document.getElementById(`${carouselId}-dot-${i}`);
                if (dot) dot.classList.toggle('active', i === index);
            }
        }

        function carouselPrev(carouselId, event) { carouselNav(carouselId, -1, event); }
        function carouselNext(carouselId, event) { carouselNav(carouselId, 1, event); }

        document.addEventListener('DOMContentLoaded', () => {
            createGalleryItems();

            // Set an initial gallery state if none exists
            if (!history.state) {
                history.replaceState({ view: 'gallery' }, '', location.pathname);
            }

            // Support deep linking via hash like #artwork-<id>
            if (location.hash && location.hash.startsWith('#artwork-')) {
                const id = location.hash.replace('#artwork-', '');
                if (artworks[id]) {
                    showArtworkDetail(id);
                }
            } else {
                // Ensure gallery is visible on first load
                showHome();
            }
        });
    </script>
</body>
</html>
